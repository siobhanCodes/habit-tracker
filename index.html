<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --card-2: #1f2330;
    --text: #e8eaed;
    --muted: #9aa0aa;
    --accent: #6ee7b7;
    --accent-2: #34d399;
    --border: #2a2f3a;
    --danger: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --card-2: #f0f2f5;
      --text: #1a1d23;
      --muted: #6b7280;
      --accent: #10b981;
      --accent-2: #059669;
      --border: #e3e6eb;
      --danger: #dc2626;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  header { margin-bottom: 28px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); font-size: 0.95rem; margin: 0; }

  .add-row { display: flex; gap: 10px; margin: 24px 0; }
  .add-row input {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    outline: none;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row button {
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent-2);
    color: #06281d;
    cursor: pointer;
  }
  .add-row button:hover { background: var(--accent); }

  .habit {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .habit-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .habit-name { font-weight: 600; font-size: 1.05rem; }
  .habit-meta { display: flex; align-items: center; gap: 14px; }
  .streak {
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .streak b { color: var(--accent); }
  .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 4px;
    line-height: 1;
  }
  .delete-btn:hover { color: var(--danger); }

  .week { display: flex; gap: 8px; margin-top: 14px; }
  .day {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  .day .dow { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .day .dom { font-size: 0.7rem; color: var(--muted); }
  .box {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 44px;
    border-radius: 10px;
    background: var(--card-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .day:hover .box { transform: scale(1.06); }
  .box.done {
    background: var(--accent-2);
    border-color: var(--accent-2);
    color: #06281d;
    font-weight: 700;
  }
  .day.today .dow { color: var(--accent); font-weight: 700; }
  .day.today .box { border-color: var(--accent); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 50px 20px;
    border: 1px dashed var(--border);
    border-radius: 14px;
  }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 40px; }
  footer a { color: var(--accent-2); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🌱 Habit Tracker</h1>
      <p class="subtitle">Check off your habits each day and build your streak. Everything saves automatically in your browser.</p>
    </header>

    <div class="add-row">
      <input id="newHabit" type="text" placeholder="Add a habit (e.g. Drink water, Read 10 pages)" maxlength="60" />
      <button id="addBtn">Add</button>
    </div>

    <div id="list"></div>

    <footer>Built as a learning project · Data stays private on your device</footer>
  </div>

<script>
  // ---- Data helpers ----
  var STORAGE_KEY = "habitTracker.v1";

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }
  function save(habits) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
  }

  // Return YYYY-MM-DD for a given Date
  function key(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  // Last 7 days, oldest -> today
  function lastSevenDays() {
    var days = [];
    var now = new Date();
    for (var i = 6; i >= 0; i--) {
      var d = new Date(now);
      d.setDate(now.getDate() - i);
      days.push(d);
    }
    return days;
  }

  // Current streak: consecutive completed days counting back from today
  function streakOf(habit) {
    var count = 0;
    var d = new Date();
    while (habit.done[key(d)]) {
      count++;
      d.setDate(d.getDate() - 1);
    }
    return count;
  }

  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var habits = load();

  // ---- Rendering ----
  function render() {
    var list = document.getElementById("list");
    list.innerHTML = "";

    if (habits.length === 0) {
      list.innerHTML = '<div class="empty">No habits yet. Add your first one above to get started! 👆</div>';
      return;
    }

    var todayKey = key(new Date());

    habits.forEach(function (habit, index) {
      var card = document.createElement("div");
      card.className = "habit";

      var streak = streakOf(habit);
      var streakText = streak > 0
        ? '🔥 <b>' + streak + '</b> day' + (streak === 1 ? '' : 's')
        : 'No streak yet';

      var top = document.createElement("div");
      top.className = "habit-top";
      top.innerHTML =
        '<span class="habit-name"></span>' +
        '<span class="habit-meta">' +
          '<span class="streak">' + streakText + '</span>' +
          '<button class="delete-btn" title="Delete habit">✕</button>' +
        '</span>';
      top.querySelector(".habit-name").textContent = habit.name;
      top.querySelector(".delete-btn").addEventListener("click", function () {
        if (confirm('Delete "' + habit.name + '"? This cannot be undone.')) {
          habits.splice(index, 1);
          save(habits);
          render();
        }
      });
      card.appendChild(top);

      var week = document.createElement("div");
      week.className = "week";
      lastSevenDays().forEach(function (d) {
        var k = key(d);
        var day = document.createElement("div");
        day.className = "day" + (k === todayKey ? " today" : "");
        var done = !!habit.done[k];
        day.innerHTML =
          '<span class="dow">' + DOW[d.getDay()] + '</span>' +
          '<div class="box' + (done ? ' done' : '') + '">' + (done ? '✓' : '') + '</div>' +
          '<span class="dom">' + d.getDate() + '</span>';
        day.addEventListener("click", function () {
          if (habit.done[k]) {
            delete habit.done[k];
          } else {
            habit.done[k] = true;
          }
          save(habits);
          render();
        });
        week.appendChild(day);
      });
      card.appendChild(week);

      list.appendChild(card);
    });
  }

  // ---- Adding habits ----
  function addHabit() {
    var input = document.getElementById("newHabit");
    var name = input.value.trim();
    if (!name) return;
    habits.push({ name: name, done: {} });
    save(habits);
    input.value = "";
    render();
    input.focus();
  }

  document.getElementById("addBtn").addEventListener("click", addHabit);
  document.getElementById("newHabit").addEventListener("keydown", function (e) {
    if (e.key === "Enter") addHabit();
  });

  render();
</script>
</body>
</html>
